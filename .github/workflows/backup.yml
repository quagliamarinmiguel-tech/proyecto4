name: Backup Supabase a Google Drive

on:
  schedule:
    # Ejecutar todos los días a las 2:00 AM UTC (aproximadamente 10 PM en Venezuela)
    - cron: '0 2 * * *'
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Crear volcados (roles, esquema, datos)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p backup
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/data.sql --data-only --use-copy

      - name: Comprimir y cifrar
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          cd backup
          tar -czf ../supabase_backup.tar.gz .
          cd ..
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 100000 \
            -in supabase_backup.tar.gz \
            -out supabase_backup_$(date +%Y-%m-%d).tar.gz.enc \
            -pass pass:"$ENCRYPTION_KEY"
          rm supabase_backup.tar.gz

      - name: Subir a Google Drive
        uses: samuelint/google-drive-upload@v1.1.3
        with:
          folder_id: ${{ secrets.GDRIVE_FOLDER_ID }}
          service_account: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT }}
          source_path: supabase_backup_*.tar.gz.enc
